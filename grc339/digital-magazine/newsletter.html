<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="styles.css">
        <title>Subscribe to 365 Living</title>
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <link rel="stylesheet" href="https://use.typekit.net/vuk2qxr.css">
    </head>

    <body>
        <div class="newsletter-container">
            <header>
                <h1><a href="index.html"><img src="logo.svg" alt="Cool Logo"></a> </h1>
                <nav>
                    <ul>
                        <li><a href="#">Reflections</a></li>
                        <li><a href="#">Design your Spaces</a></li>
                        <li><a href="#">Daily Rituals</a></li>
                        <li><a href="#">Subscribe</a></li>
                    </ul>
                </nav>
            </header>
          
<main class="newsletter">

    <h2>Subscribe to 365 Living</h2>
    <figure>
        <img src="8ball.jpeg" alt="Person playing billiards.">
    </figure>

    <form>
        <section class="preferences">
            <h3>Choose Your Newsletter</h3>

            <ul>
                <li>
                    <input type="checkbox" id="reset" name="reset">
                    <label for="reset">
                        <strong>The Sunday Reset</strong><br>
                        Weekly routines, small habits, and inspiration for the week ahead.
                    </label>
                </li>

                <li>
                    <input type="checkbox" id="journal" name="journal">
                    <label for="journal">
                        <strong>Journal and Mindfulness</strong><br>
                        For readers who want guidance on figuring things out.
                    </label>
                </li>

                <li>
                    <input type="checkbox" id="designing" name="designing">
                    <label for="designing">
                        <strong>Designing You</strong><br>
                        Best for home inspiration, styling, and curation.
                    </label>
                </li>
            </ul>
        </section>
        <section class="personal-info">
            <h3>Your Information</h3>

            <ul>
                <li>
                    <label for="fname">First Name:</label>
                    <input type="text" name="fname" id="fname" placeholder="First name">
                </li>

                <li>
                    <label for="lname">Last Name:</label>
                    <input type="text" name="lname" id="lname" placeholder="Last name">
                </li>

                <li>
                    <label for="email">Email Address:</label>
                    <input type="email" name="email" id="email" placeholder="Your email">
                </li>
            </ul>
        </section>

        <button type="submit">Subscribe</button>

    </form>

</main>
            <footer>
                <p>365 Living. All rights reserved.</p>
            </footer>
        </div>
    </body>
</html>
